<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Tusk: type here</title>
<!-- The chat's typing box, shown as an iframe inside Tusk's chat. Being its own page, it keeps
     focus and key presses away from the website (dialogs that trap focus, keyboard shortcuts). -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font: 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; color: #1f2933; }
  form { display: flex; gap: 8px; align-items: center; padding: 4px; box-sizing: border-box; height: 100vh; }
  input {
    flex: 1; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 8px 16px;
    border: 2px solid #99bbbb; border-radius: 26px; background: #fff; color: inherit; font: inherit;
  }
  input:focus { outline: 3px solid #ffb703; outline-offset: 1px; border-color: #2f9e6d; }
  button {
    min-height: 48px; min-width: 80px; padding: 8px 20px; border-radius: 24px; border: 2px solid #2f9e6d;
    background: #2f9e6d; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <input id="t" type="text" enterkeyhint="send" spellcheck="true">
  <button id="s" type="submit">Send</button>
</form>
<script type="module" src="./compose.ts"></script>
</body>
</html>
