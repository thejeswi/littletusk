<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Tusk: type here</title>
<!-- The chat's typing box, shown as an iframe inside Tusk's chat. Being its own page, it keeps
     focus and key presses away from the website (dialogs that trap focus, keyboard shortcuts).
     The microphone and the live words live here too (A1). -->
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { font: 17px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; color: #1f2933; }
  /* Height follows the content: the chat sizes this frame to fit, so there is no empty strip
     under the send bar. compose.ts reports the measured height to the overlay. */
  #wrap { display: flex; flex-direction: column; gap: 4px; padding: 4px; box-sizing: border-box; }
  form { display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1; min-width: 0; min-height: 64px; box-sizing: border-box; padding: 8px 16px;
    border: 2px solid #99bbbb; border-radius: 20px; background: #fff; color: inherit; font: inherit;
    line-height: 1.35; resize: none;
  }
  textarea:focus { outline: 3px solid #ffb703; outline-offset: 1px; border-color: #2f9e6d; }
  button {
    min-height: 48px; padding: 8px 16px; border-radius: 24px; border: 2px solid #2f9e6d;
    background: #2f9e6d; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  #m { min-width: 48px; width: 48px; padding: 0; border-radius: 50%; border-color: #99bbbb; background: #fff; color: #1f2933; font-size: 20px; }
  #m.on { background: #b42318; border-color: #b42318; color: #fff; }
  #m:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 3px solid #ffb703; outline-offset: 2px; }
  #hint { font-size: 14px; line-height: 1.35; color: #52606d; padding: 0 4px; min-height: 38px; }
  #hint[hidden] { display: none; }
  .bar { height: 7px; border-radius: 4px; background: #e3e8ec; overflow: hidden; margin: 4px 0 2px; }
  .bar[hidden] { display: none; }
  .bar i { display: block; height: 100%; width: 40%; background: #2f9e6d; }
  .bar.indeterminate i { animation: bar 1.2s ease-in-out infinite; }
  @keyframes bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  @media (prefers-reduced-motion: reduce) { .bar.indeterminate i { animation: none; width: 100%; } }
</style>
</head>
<body>
<div id="wrap">
  <form id="f" autocomplete="off">
    <textarea id="t" rows="2" enterkeyhint="send" spellcheck="true"></textarea>
    <button id="m" type="button" aria-pressed="false" hidden>🎤</button>
    <button id="s" type="submit">Send</button>
  </form>
  <div id="hint" role="status" aria-live="polite" hidden>
    <div id="h1"></div>
    <div id="h2"></div>
    <div id="bar" class="bar" hidden><i></i></div>
  </div>
</div>
<script type="module" src="./compose.ts"></script>
</body>
</html>
